# Builds the program folder (exe + lib/ + data/) for Windows and Linux, runs each build's
# self-test, and on a v* tag attaches both archives to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/JLCPCB-Stackup-Solver/JLCPCB-Stackup-Solver.exe
            asset: JLCPCB-Stackup-Solver-windows-x64.zip
          - os: ubuntu-22.04          # glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+
            exe: dist/JLCPCB-Stackup-Solver/JLCPCB-Stackup-Solver
            asset: JLCPCB-Stackup-Solver-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (bundled into the Linux build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 libegl1 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Self-test from source
        shell: bash
        env:
          JLC_STACKUP_HOME: ${{ runner.temp }}/home-src
        run: python -m jlc --selftest
      - name: Build
        run: pyinstaller --noconfirm packaging/JLCPCB-Stackup-Solver.spec
      - name: Self-test of the packaged build (writes into its own data/)
        shell: bash
        run: |
          code=0
          "${{ matrix.exe }}" --selftest || code=$?
          d=dist/JLCPCB-Stackup-Solver/data
          cat "$d/selftest.log"
          rm -rf "$d/selftest.log" "$d/settings.json" "$d/cache" "$d/logs"
          exit $code
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "${{ matrix.asset }}" JLCPCB-Stackup-Solver
          else
            7z a -tzip "${{ matrix.asset }}" JLCPCB-Stackup-Solver > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
