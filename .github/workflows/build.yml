# Builds the program folder (exe + lib/ + data/) for Windows and Linux, runs each build's
# self-test, and on a v* tag attaches both archives to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/JLCPCB-Stackup-Solver/JLCPCB-Stackup-Solver.exe
            suffix: windows-x64.zip
          - os: ubuntu-22.04          # glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+
            exe: dist/JLCPCB-Stackup-Solver/JLCPCB-Stackup-Solver
            suffix: linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Version (from jlc/__init__.py; the tag and README must match it)
        id: version
        shell: bash
        run: |
          v=$(python -c "import jlc; print(jlc.__version__)")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $v"; exit 1
          fi
          if ! grep -q "releases/download/v$v/JLCPCB-Stackup-Solver-v$v-${{ matrix.suffix }}" README.md; then
            echo "::error::README does not link to version $v"; exit 1
          fi
          echo "asset=JLCPCB-Stackup-Solver-v$v-${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
      - name: Qt runtime libraries (bundled into the Linux build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 libegl1 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Self-test from source
        shell: bash
        env:
          JLC_STACKUP_HOME: ${{ runner.temp }}/home-src
        run: python -m jlc --selftest
      - name: Build
        run: pyinstaller --noconfirm packaging/JLCPCB-Stackup-Solver.spec
      - name: Self-test on an X display (the offscreen one below would not notice a missing xcb library)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y xvfb
          code=0
          QT_QPA_PLATFORM=xcb xvfb-run -a "${{ matrix.exe }}" --selftest || code=$?
          d=dist/JLCPCB-Stackup-Solver/data
          cat "$d/selftest.log" || true
          rm -rf "$d/selftest.log" "$d/selftest" "$d/settings.json" "$d/cache" "$d/logs"
          exit $code
      - name: Self-test of the packaged build (writes into its own data/)
        shell: bash
        run: |
          code=0
          "${{ matrix.exe }}" --selftest || code=$?
          d=dist/JLCPCB-Stackup-Solver/data
          cat "$d/selftest.log"
          cp -r "$d/selftest" "$RUNNER_TEMP/selftest"
          rm -rf "$d/selftest.log" "$d/selftest" "$d/settings.json" "$d/cache" "$d/logs"
          exit $code
      - name: Open the KiCad export with KiCad itself
        if: runner.os == 'Linux'
        continue-on-error: true         # a check of the export, not of the build
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases > /dev/null
          sudo apt-get install -y --no-install-recommends kicad > /dev/null
          kicad-cli version
          cd "$RUNNER_TEMP/selftest"
          cp -r . ../broken && printf '(version 1)\n(rule "bad" (bogus))\n' > ../broken/selftest.kicad_dru
          echo "== board as KiCad saves it (parsed, upgraded):"
          kicad-cli pcb upgrade --force selftest.kicad_pcb
          sed -n '/(layers/,/^\t)/p;/(stackup/,/copper_finish/p' selftest.kicad_pcb
          echo "== DRC with our rules:"
          kicad-cli pcb drc --severity-all --format json -o drc.json selftest.kicad_pcb 2>&1 | tee drc.log
          echo "== DRC with a broken rules file (for comparison):"
          kicad-cli pcb drc --severity-all --format json -o ../broken/drc.json ../broken/selftest.kicad_pcb 2>&1 | tee ../broken/drc.log
          python3 - <<'EOF'
          import json
          ours, bad = (json.load(open(p)) for p in ("drc.json", "../broken/drc.json"))
          def kinds(d):
              return sorted({v["type"] for v in d.get("violations", [])})
          print("our rules:", kinds(ours))
          print("broken rules:", kinds(bad))
          assert kinds(ours) != kinds(bad) or "rule" not in " ".join(kinds(bad)), "rule errors look the same"
          assert not any("rule" in k for k in kinds(ours)), "KiCad reports a problem with our rules"
          EOF
      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "${{ steps.version.outputs.asset }}" JLCPCB-Stackup-Solver
          else
            7z a -tzip "${{ steps.version.outputs.asset }}" JLCPCB-Stackup-Solver > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.asset }}
          path: dist/${{ steps.version.outputs.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
