# Builds the single-file app for Windows and Linux, runs each build's self-test,
# and on a v* tag attaches both to a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: dist/JLCPCB-Stackup-Solver.exe
            asset: JLCPCB-Stackup-Solver-windows-x64.exe
          - os: ubuntu-22.04          # glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora 36+, RHEL 9+
            exe: dist/JLCPCB-Stackup-Solver
            asset: JLCPCB-Stackup-Solver-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries (bundled into the Linux build)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxkbcommon-x11-0 libegl1 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Self-test from source
        shell: bash
        env:
          JLC_STACKUP_HOME: ${{ runner.temp }}/home-src
        run: python jlcapp.pyw --selftest
      - name: Build
        run: pyinstaller --noconfirm JLCPCB-Stackup-Solver.spec
      - name: Self-test of the packaged build
        shell: bash
        env:
          JLC_STACKUP_HOME: ${{ runner.temp }}/home-exe
        run: |
          code=0
          "${{ matrix.exe }}" --selftest || code=$?
          cat "$JLC_STACKUP_HOME/selftest.log"
          exit $code
      - name: Package
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            tar -czf "dist/${{ matrix.asset }}" -C dist JLCPCB-Stackup-Solver
          else
            mv "${{ matrix.exe }}" "dist/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
